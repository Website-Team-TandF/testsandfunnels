<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERN Leads Dashboard &bull; tests&amp;funnels</title>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #121829;
      --card-hover: #172138;
      --border: #232d4b;
      --text: #f0f4fc;
      --muted: #8b99b5;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #06b6d4;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .header {
      background: rgba(18, 24, 41, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      padding: 0.9rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .brand span { color: var(--accent); }
    .badge-pill {
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(79, 70, 229, 0.2);
      color: #818cf8;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      border: 1px solid rgba(79, 70, 229, 0.3);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #1e293b; color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

    .main-wrap { max-width: 1400px; margin: 0 auto; padding: 1.75rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .stat-card.c1::after { background: var(--primary); }
    .stat-card.c2::after { background: var(--accent); }
    .stat-card.c3::after { background: var(--amber); }
    .stat-card.c4::after { background: var(--green); }
    .stat-label { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.35rem; }
    .stat-val { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .search-input {
      flex: 1;
      min-width: 260px;
      padding: 0.55rem 0.85rem;
      background: #0b101d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.88rem;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .select-input {
      background: #0b101d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.85rem;
    }
    .select-input:focus { outline: none; border-color: var(--accent); }

    .table-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th {
      background: #0e1424;
      padding: 0.85rem 1rem;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 1rem; border-bottom: 1px solid rgba(35, 46, 77, 0.6); vertical-align: middle; }
    tr:hover td { background: var(--card-hover); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-New { background: rgba(6, 182, 212, 0.2); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-Contacted { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-InDiscussion { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-Converted { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-Closed { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    .tag {
      display: inline-block;
      background: #1e293b;
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 0.2rem;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .contact-link:hover { text-decoration: underline; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .detail-row { display: grid; grid-template-columns: 140px 1fr; gap: 0.5rem; margin-bottom: 0.75rem; font-size: 0.88rem; }
    .detail-label { color: var(--muted); font-weight: 600; }
    .detail-val { color: #fff; word-break: break-word; }
    .notes-textarea {
      width: 100%;
      padding: 0.75rem;
      background: #0b101d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.88rem;
      min-height: 90px;
      resize: vertical;
      margin-top: 0.4rem;
    }
    .notes-textarea:focus { outline: none; border-color: var(--accent); }

    /* LOGIN SCREEN */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 20%, #17213d 0%, var(--bg) 70%);
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // API Helper
    const API = {
      getToken() { return localStorage.getItem('tf_jwt_token'); },
      setToken(t) { localStorage.setItem('tf_jwt_token', t); },
      removeToken() { localStorage.removeItem('tf_jwt_token'); },
      headers() {
        return {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${this.getToken()}`
        };
      }
    };

    function App() {
      const [token, setToken] = useState(API.getToken());
      const [user, setUser] = useState(null);

      useEffect(() => {
        if (token) {
          fetch('/api/auth/verify', { headers: API.headers() })
            .then(r => r.json())
            .then(data => {
              if (data.success) setUser(data.user);
              else handleLogout();
            })
            .catch(() => handleLogout());
        }
      }, [token]);

      const handleLoginSuccess = (newToken, userData) => {
        API.setToken(newToken);
        setToken(newToken);
        setUser(userData);
      };

      const handleLogout = () => {
        API.removeToken();
        setToken(null);
        setUser(null);
      };

      if (!token) {
        return <LoginView onLogin={handleLoginSuccess} />;
      }

      return <DashboardView user={user} onLogout={handleLogout} />;
    }

    function LoginView({ onLogin }) {
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('admin@tandf2026');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (data.success && data.token) {
            onLogin(data.token, data.user);
          } else {
            setError(data.error || 'Invalid credentials');
          }
        } catch (err) {
          setError('Network error. Check server status.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-container">
          <div className="login-card">
            <h1 className="brand" style={{ justifyContent: 'center', marginBottom: '0.4rem', fontSize: '1.6rem' }}>
              <span>tests</span>&amp;funnels
            </h1>
            <p style={{ textAlign: 'center', color: 'var(--muted)', fontSize: '0.88rem', marginBottom: '1.75rem' }}>
              MERN Stack Leads Dashboard
            </p>

            {error && (
              <div style={{ background: 'rgba(239,68,68,0.15)', border: '1px solid #ef4444', color: '#fca5a5', padding: '0.75rem', borderRadius: 8, fontSize: '0.85rem', marginBottom: '1rem', textAlign: 'center' }}>
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div style={{ marginBottom: '1.2rem' }}>
                <label style={{ display: 'block', fontSize: '0.78rem', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', marginBottom: '0.4rem' }}>
                  Username
                </label>
                <input
                  type="text"
                  className="search-input"
                  style={{ width: '100%' }}
                  value={username}
                  onChange={e => setUsername(e.target.value)}
                  required
                />
              </div>

              <div style={{ marginBottom: '1.5rem' }}>
                <label style={{ display: 'block', fontSize: '0.78rem', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', marginBottom: '0.4rem' }}>
                  Password
                </label>
                <input
                  type="password"
                  className="search-input"
                  style={{ width: '100%' }}
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  required
                />
              </div>

              <button
                type="submit"
                className="btn btn-primary"
                style={{ width: '100%', padding: '0.8rem', justifyContent: 'center', fontSize: '0.95rem' }}
                disabled={loading}
              >
                {loading ? 'Authenticating...' : 'Sign In with JWT'}
              </button>
            </form>

            <div style={{ textAlign: 'center', marginTop: '1.5rem', color: 'var(--muted)', fontSize: '0.8rem' }}>
              Default: <code>admin</code> / <code>admin@tandf2026</code>
            </div>
          </div>
        </div>
      );
    }

    function DashboardView({ user, onLogout }) {
      const [leads, setLeads] = useState([]);
      const [stats, setStats] = useState({ total: 0, newLeads: 0, converted: 0, todayCount: 0 });
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [typeFilter, setTypeFilter] = useState('All');
      const [selectedLead, setSelectedLead] = useState(null);
      const [loading, setLoading] = useState(true);

      const fetchLeads = async () => {
        setLoading(true);
        try {
          const res = await fetch('/api/leads', { headers: API.headers() });
          const data = await res.json();
          if (data.success) {
            setLeads(data.leads || []);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const fetchStats = async () => {
        try {
          const res = await fetch('/api/leads/stats', { headers: API.headers() });
          const data = await res.json();
          if (data.success) setStats(data.stats);
        } catch (e) {}
      };

      useEffect(() => {
        fetchLeads();
        fetchStats();
      }, []);

      const filteredLeads = useMemo(() => {
        return leads.filter(l => {
          const s = (statusFilter === 'All') || (l.status && l.status.toLowerCase() === statusFilter.toLowerCase());
          const t = (typeFilter === 'All') || (l.form_type && l.form_type.toLowerCase() === typeFilter.toLowerCase());
          const q = search.toLowerCase();
          const matchQ = !q || [l.name, l.phone, l.email, l.industry, l.message, l.admin_notes].filter(Boolean).some(val => val.toLowerCase().includes(q));
          return s && t && matchQ;
        });
      }, [leads, statusFilter, typeFilter, search]);

      const handleUpdateLead = async (id, newStatus, newNotes) => {
        try {
          const res = await fetch(`/api/leads/${id}`, {
            method: 'PUT',
            headers: API.headers(),
            body: JSON.stringify({ status: newStatus, admin_notes: newNotes })
          });
          const data = await res.json();
          if (data.success) {
            fetchLeads();
            fetchStats();
            setSelectedLead(null);
          }
        } catch (e) {
          alert('Failed to update lead');
        }
      };

      const handleDeleteLead = async (id) => {
        if (!confirm('Are you sure you want to delete this lead?')) return;
        try {
          const res = await fetch(`/api/leads/${id}`, {
            method: 'DELETE',
            headers: API.headers()
          });
          const data = await res.json();
          if (data.success) {
            fetchLeads();
            fetchStats();
            if (selectedLead && (selectedLead._id === id || selectedLead.id === id)) setSelectedLead(null);
          }
        } catch (e) {
          alert('Failed to delete');
        }
      };

      const handleExportCSV = () => {
        const token = API.getToken();
        window.open(`/api/leads/export?token=${encodeURIComponent(token)}`, '_blank');
      };

      return (
        <div>
          <header className="header">
            <div className="brand">
              <span>tests</span>&amp;funnels
              <span className="badge-pill">MERN Leads CRM</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              <button className="btn btn-secondary" onClick={handleExportCSV}>
                ⬇ Export CSV
              </button>
              <button className="btn btn-danger" onClick={onLogout}>
                Log Out
              </button>
            </div>
          </header>

          <main className="main-wrap">
            {/* KPI STATS */}
            <div className="stats-grid">
              <div className="stat-card c1">
                <div className="stat-label">Total Inquiries</div>
                <div className="stat-val">{stats.total}</div>
              </div>
              <div className="stat-card c2">
                <div className="stat-label">New / Unread</div>
                <div className="stat-val" style={{ color: '#22d3ee' }}>{stats.newLeads}</div>
              </div>
              <div className="stat-card c3">
                <div className="stat-label">Today's Leads</div>
                <div className="stat-val" style={{ color: '#fbbf24' }}>{stats.todayCount}</div>
              </div>
              <div className="stat-card c4">
                <div className="stat-label">Converted</div>
                <div className="stat-val" style={{ color: '#34d399' }}>{stats.converted}</div>
              </div>
            </div>

            {/* FILTER TOOLBAR */}
            <div className="toolbar">
              <input
                type="text"
                className="search-input"
                placeholder="Search name, phone, email, industry, notes..."
                value={search}
                onChange={e => setSearch(e.target.value)}
              />
              <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                <select className="select-input" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                  <option value="All">All Statuses</option>
                  <option value="New">New</option>
                  <option value="Contacted">Contacted</option>
                  <option value="In Discussion">In Discussion</option>
                  <option value="Converted">Converted</option>
                  <option value="Closed">Closed</option>
                </select>
                <button className="btn btn-secondary" onClick={() => { fetchLeads(); fetchStats(); }}>
                  ↻ Refresh
                </button>
              </div>
            </div>

            {/* LEADS TABLE */}
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Status</th>
                    <th>Date &amp; Time</th>
                    <th>Lead Info</th>
                    <th>Contact</th>
                    <th>Form &amp; Budget</th>
                    <th>Message</th>
                    <th style={{ textAlign: 'right' }}>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredLeads.length === 0 ? (
                    <tr>
                      <td colSpan="7" style={{ textAlign: 'center', padding: '3.5rem', color: 'var(--muted)' }}>
                        <h3>No leads found</h3>
                        <p>{loading ? 'Loading...' : 'Submissions from tests&funnels forms will automatically stream here in real time.'}</p>
                      </td>
                    </tr>
                  ) : (
                    filteredLeads.map(l => {
                      const id = l._id || l.id;
                      const cleanPhone = (l.phone || '').replace(/[^0-9]/g, '');
                      const statusClass = `badge-${(l.status || 'New').replace(/\s+/g, '')}`;
                      const dateStr = l.createdAt ? new Date(l.createdAt).toLocaleString() : (l.created_at || '');

                      return (
                        <tr key={id}>
                          <td><span className={`badge ${statusClass}`}>{l.status || 'New'}</span></td>
                          <td style={{ whiteSpace: 'nowrap', color: 'var(--muted)', fontSize: '0.8rem' }}>{dateStr}</td>
                          <td>
                            <div style={{ fontWeight: 700, color: '#fff', fontSize: '0.95rem' }}>{l.name}</div>
                            {l.website && <div style={{ fontSize: '0.78rem', color: 'var(--muted)' }}>{l.website}</div>}
                          </td>
                          <td>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.2rem' }}>
                              {l.phone && (
                                <>
                                  <a href={`tel:${cleanPhone}`} className="contact-link">📞 {l.phone}</a>
                                  <a
                                    href={`https://wa.me/${cleanPhone}?text=${encodeURIComponent(`Hi ${l.name}, thanks for reaching out to tests&funnels!`)}`}
                                    target="_blank"
                                    rel="noopener"
                                    className="contact-link"
                                    style={{ color: '#25d366' }}
                                  >
                                    💬 WhatsApp
                                  </a>
                                </>
                              )}
                              {l.email && <a href={`mailto:${l.email}`} className="contact-link" style={{ color: 'var(--muted)' }}>✉ {l.email}</a>}
                            </div>
                          </td>
                          <td>
                            <div style={{ fontWeight: 600 }}>{l.form_type}</div>
                            {l.industry && <span className="tag">{l.industry}</span>}
                            {l.monthly_ad_spend && <span className="tag">Spend: {l.monthly_ad_spend}</span>}
                          </td>
                          <td style={{ maxWidth: 220, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--muted)' }}>
                            {l.message || '—'}
                          </td>
                          <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                            <button className="btn btn-secondary" onClick={() => setSelectedLead(l)}>View</button>{' '}
                            <button className="btn btn-danger" onClick={() => handleDeleteLead(id)}>✕</button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </main>

          {/* DETAIL MODAL */}
          {selectedLead && (
            <LeadModal
              lead={selectedLead}
              onClose={() => setSelectedLead(null)}
              onSave={handleUpdateLead}
            />
          )}
        </div>
      );
    }

    function LeadModal({ lead, onClose, onSave }) {
      const id = lead._id || lead.id;
      const [status, setStatus] = useState(lead.status || 'New');
      const [notes, setNotes] = useState(lead.admin_notes || '');

      return (
        <div className="modal-backdrop">
          <div className="modal-box">
            <div className="modal-header">
              <h2 style={{ fontSize: '1.2rem', fontWeight: 800, color: '#fff' }}>{lead.name} &bull; Details</h2>
              <button style={{ background: 'none', border: 'none', color: 'var(--muted)', fontSize: '1.5rem', cursor: 'pointer' }} onClick={onClose}>&times;</button>
            </div>

            <div className="detail-row"><div className="detail-label">Lead ID:</div><div className="detail-val">{id}</div></div>
            <div className="detail-row"><div className="detail-label">Date:</div><div className="detail-val">{lead.createdAt ? new Date(lead.createdAt).toLocaleString() : (lead.created_at || '—')}</div></div>
            <div className="detail-row"><div className="detail-label">Phone:</div><div className="detail-val">{lead.phone || '—'}</div></div>
            <div className="detail-row"><div className="detail-label">Email:</div><div className="detail-val">{lead.email || '—'}</div></div>
            <div className="detail-row"><div className="detail-label">Form Type:</div><div className="detail-val">{lead.form_type}</div></div>
            <div className="detail-row"><div className="detail-label">Industry:</div><div className="detail-val">{lead.industry || '—'}</div></div>
            <div className="detail-row"><div className="detail-label">Ad Spend:</div><div className="detail-val">{lead.monthly_ad_spend || '—'}</div></div>
            <div className="detail-row"><div className="detail-label">Message:</div><div className="detail-val" style={{ whiteSpace: 'pre-wrap' }}>{lead.message || '—'}</div></div>
            <div className="detail-row"><div className="detail-label">Source Page:</div><div className="detail-val">{lead.source_page || '—'}</div></div>
            <div className="detail-row"><div className="detail-label">IP Address:</div><div className="detail-val">{lead.ip_address || '—'}</div></div>

            <div style={{ marginTop: '1.25rem', paddingTop: '1rem', borderTop: '1px solid var(--border)' }}>
              <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 700, color: 'var(--muted)', marginBottom: '0.4rem' }}>
                STATUS
              </label>
              <select className="select-input" style={{ width: '100%', marginBottom: '1rem' }} value={status} onChange={e => setStatus(e.target.value)}>
                <option value="New">New</option>
                <option value="Contacted">Contacted</option>
                <option value="In Discussion">In Discussion</option>
                <option value="Converted">Converted</option>
                <option value="Closed">Closed</option>
              </select>

              <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 700, color: 'var(--muted)', marginBottom: '0.4rem' }}>
                TEAM NOTES
              </label>
              <textarea
                className="notes-textarea"
                placeholder="Log call updates, client proposals, budget remarks..."
                value={notes}
                onChange={e => setNotes(e.target.value)}
              />
            </div>

            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '1.5rem', paddingTop: '1rem', borderTop: '1px solid var(--border)' }}>
              <button className="btn btn-secondary" onClick={onClose}>Close</button>
              <button className="btn btn-primary" onClick={() => onSave(id, status, notes)}>Save Changes</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
