# Deploy to Hostinger
#
# What it does: on every push to main (or a manual run), build the Astro site
# and upload the generated dist/ folder to Hostinger over FTP.
# Why: pushing to GitHub does not touch Hostinger on its own. This bridges them,
# so "git push" becomes the deploy.
#
# One-time setup (GitHub -> repo Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    the FTP IP/host, e.g. 88.222.209.24  (hPanel -> Files -> FTP Accounts)
#   FTP_USERNAME  the full FTP username exactly as hPanel lists it
#   FTP_PASSWORD  that account's password
# server-dir below assumes an FTP account rooted at /public_html (the dedicated
# "testsandfunnels" account). If you use the MAIN account (it lands in the home
# dir), change server-dir to ./public_html/ instead.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload dist/ to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
